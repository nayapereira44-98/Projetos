<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<title>Rota Certa</title>
<style>
:root {
  --bg: #f5f6f8; --surface: #ffffff; --ink: #111827; --muted: #6b7280; --line: #e5e7eb; --soft: #f1f3f6;
  --accent: #2563eb; --accent-soft: #e8efff; --ok: #16a34a; --ok-soft: #e7f6ec; --warn: #b45309; --warn-soft: #fdf3e3; --bad: #dc2626; --bad-soft: #fdecec;
  --r: 14px; --shadow: 0 1px 2px rgba(17,24,39,.06), 0 4px 16px rgba(17,24,39,.06);
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f1115; --surface: #181b21; --ink: #f3f4f6; --muted: #9ca3af; --line: #2a2e36; --soft: #20242b; --accent: #5b8cff; --accent-soft: #1d2a47; --ok: #34c56b; --ok-soft: #15301f; --warn: #f0a245; --warn-soft: #34270f; --bad: #f26d6d; --bad-soft: #3a1919; --shadow: 0 1px 2px rgba(0,0,0,.4); }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
h1, h2, h3 { margin: 0; letter-spacing: -.01em; }
h1 { font-size: 1.6rem; } h2 { font-size: 1.15rem; } h3 { font-size: 1rem; }
p { margin: 0; }
button, .btn { font: inherit; font-weight: 600; min-height: 48px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; cursor: pointer; }
button:active, .btn:active { transform: scale(.98); }
.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
.ghost { background: transparent; border-color: transparent; color: var(--accent); }
.danger { color: var(--bad); }
.sm { min-height: 40px; padding: 0 12px; font-size: .92rem; }
.full { width: 100%; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
.i { width: 22px; height: 22px; flex: none; }
[hidden] { display: none !important; }

/* topo e navegação */
.top { position: sticky; top: 0; z-index: 30; background: var(--surface); border-bottom: 1px solid var(--line); padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.top b { font-size: 1.05rem; }
.top .muted { font-size: .82rem; }
.top-r { display: flex; align-items: center; gap: 8px; }
.bell { position: relative; width: 40px; min-height: 40px; padding: 0; border-radius: 50%; border: 0; background: var(--soft); }
.bell span { position: absolute; top: -2px; right: -2px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--bad); color: #fff; font-size: .7rem; display: grid; place-items: center; padding: 0 4px; }
.comm-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.comm-hint { margin-top: -6px; }
.chat { display: flex; flex-direction: column; gap: 8px; height: calc(100vh - 330px - env(safe-area-inset-bottom, 0px)); min-height: 240px; overflow-y: auto; padding: 4px 2px; -webkit-overflow-scrolling: touch; }
.msg { align-self: flex-start; max-width: 82%; background: var(--surface); border: 1px solid var(--line); border-radius: 14px 14px 14px 4px; padding: 8px 12px; display: grid; gap: 2px; }
.msg.me { align-self: flex-end; background: var(--accent-soft); border-color: transparent; border-radius: 14px 14px 4px 14px; }
.msg-who { background: none; border: 0; padding: 0; min-height: 0; font-size: .78rem; font-weight: 700; color: var(--accent); justify-content: flex-start; }
.msg-t { white-space: pre-wrap; word-break: break-word; }
.msg-h { font-size: .7rem; color: var(--muted); }
.linkbtn { background: none; border: 0; padding: 0; min-height: 0; font-size: .7rem; color: var(--muted); text-decoration: underline; font-weight: 500; }
.tipcats { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; -webkit-overflow-scrolling: touch; }
.tipcats.wrap { flex-wrap: wrap; overflow: visible; }
.tipcats button { flex: none; min-height: 36px; padding: 0 12px; border-radius: 999px; font-size: .84rem; font-weight: 500; white-space: nowrap; }
.tipcats button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.tip { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 8px; }
.tip-h { display: flex; flex-wrap: wrap; gap: 6px; }
.tip-f { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.chat-in { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.acct { width: 40px; min-height: 40px; padding: 0; border-radius: 50%; background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
body.locked > header, body.locked > section.view, body.locked > nav.tabs { display: none !important; }
#gate { display: none; }
body.locked #gate { display: block; min-height: 100vh; background: var(--bg); padding: calc(40px + env(safe-area-inset-top, 0px)) 20px 40px; }
.gate-box { max-width: 420px; margin: 0 auto; display: grid; gap: 12px; }
.gate-box h1 { font-size: 2rem; }
.gate-logo { width: 64px; height: 64px; border-radius: 18px; background: var(--accent-soft); display: grid; place-items: center; font-size: 2rem; }
.prog { height: 4px; background: var(--soft); border-radius: 2px; overflow: hidden; margin-top: 4px; width: 140px; }
.prog i { display: block; height: 100%; background: var(--ok); width: 0; }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); }
nav.tabs a, nav.tabs button { border: 0; background: none; min-height: 50px; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: .7rem; font-weight: 600; color: var(--muted); text-decoration: none; }
nav.tabs a[aria-current] { color: var(--accent); }
nav.tabs .bipbtn .c { width: 54px; height: 54px; border-radius: 50%; background: var(--ink); color: var(--surface); display: grid; place-items: center; margin-top: -22px; box-shadow: var(--shadow); }
nav.tabs .bipbtn { color: var(--ink); }
.view { padding: 16px 16px calc(96px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; max-width: 640px; margin: 0 auto; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; }
.card.flat { box-shadow: none; }

/* início */
.hello { display: grid; gap: 4px; padding: 6px 2px 2px; }
.actions { display: grid; gap: 10px; }
.act { display: grid; grid-template-columns: 44px 1fr 18px; align-items: center; gap: 12px; text-align: left; min-height: 72px; padding: 12px 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); font-weight: 400; }
.act .ic { width: 44px; height: 44px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.act b { display: block; font-size: 1rem; }
.act span.muted { font-size: .86rem; }
.act .chev { color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--soft); border-radius: 12px; padding: 10px; text-align: center; }
.stat b { display: block; font-size: 1.35rem; }
.stat span { font-size: .78rem; color: var(--muted); }
.bar { height: 6px; background: var(--soft); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ok); }

/* mapa */
#v-mapa { padding: 0; max-width: none; position: fixed; inset: 0; top: 0; z-index: 10; }
#map { position: absolute; inset: 0; background: #e9ecef; }
#map .leaflet-tile-pane { filter: saturate(.35) contrast(.95) brightness(1.04); }
@media (prefers-color-scheme: dark) { #map .leaflet-tile-pane { filter: invert(.92) hue-rotate(180deg) saturate(.25) brightness(.9); } }
.map-tools { position: absolute; right: 12px; top: calc(12px + env(safe-area-inset-top, 0px)); z-index: 500; display: grid; gap: 8px; }
.map-tools button { width: 46px; height: 46px; min-height: 46px; padding: 0; border-radius: 50%; box-shadow: var(--shadow); }
.map-tools button.on { color: var(--accent); }
.map-top { position: absolute; left: 12px; right: 70px; top: calc(12px + env(safe-area-inset-top, 0px)); z-index: 500; background: var(--surface); border-radius: 12px; padding: 8px 12px; box-shadow: var(--shadow); font-size: .85rem; }
.map-top b { font-size: .95rem; }
.next { position: absolute; left: 12px; right: 12px; bottom: calc(82px + env(safe-area-inset-bottom, 0px)); z-index: 500; background: var(--surface); border-radius: 18px; box-shadow: 0 8px 28px rgba(0,0,0,.18); padding: 14px; display: grid; gap: 10px; }
.next-h { display: grid; grid-template-columns: 46px 1fr; gap: 12px; align-items: center; text-align: left; background: none; border: 0; padding: 0; min-height: 0; font-weight: 400; color: var(--ink); }
.next-h .muted { font-size: .82rem; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.pin { width: 30px; height: 30px; border-radius: 50%; background: var(--surface); color: #111827; border: 2.5px solid #2563eb; display: grid; place-items: center; font: 700 12px/1 -apple-system, system-ui, sans-serif; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
.pin.next { width: 40px; height: 40px; background: #2563eb; color: #fff; font-size: 15px; border-color: #fff; box-shadow: 0 0 0 4px rgba(37,99,235,.25), 0 2px 6px rgba(0,0,0,.3); }
.pin.ok { background: #16a34a; border-color: #fff; color: #fff; opacity: .75; }
.pin.fail { background: #fff; border-color: #dc2626; color: #dc2626; }
.pin.other { opacity: .45; border-style: dashed; }
.pin.part { background: #fff7ed; border-color: #d97706; color: #b45309; }
.pin .vdot { position: absolute; left: -5px; top: -5px; width: 13px; height: 13px; border-radius: 50%; background: #facc15; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
.errbar { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
#bipErr { background: rgba(0,0,0,.55); color: #fff; border-color: rgba(255,255,255,.5); }
.pin .n2 { position: absolute; right: -6px; top: -6px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: #111827; color: #fff; font-size: 10px; display: grid; place-items: center; }
.me { width: 18px; height: 18px; border-radius: 50%; background: #2563eb; border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(37,99,235,.2); }

/* número da parada */
.num { width: 46px; height: 46px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 1.05rem; flex: none; }
.num.sm { width: 36px; height: 36px; font-size: .9rem; }
.num.ok { background: var(--ok); }
.num.fail { background: var(--bad); }
.num.part { background: var(--warn); }
.num.idle { background: var(--soft); color: var(--ink); }

/* folha (detalhe) */
.sheet-bg { position: fixed; inset: 0; z-index: 900; background: rgba(0,0,0,.35); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 640px; max-height: 88vh; overflow: auto; background: var(--surface); border-radius: 20px 20px 0 0; padding: 10px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 4px; }
.sheet-h { display: grid; grid-template-columns: 46px 1fr auto; gap: 12px; align-items: center; }
.sheet-h .x { width: 40px; height: 40px; min-height: 40px; padding: 0; border-radius: 50%; border: 0; background: var(--soft); }
.addr { font-weight: 700; font-size: 1.05rem; }
.pkgs { display: grid; gap: 8px; }
.pkg { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; }
.pin .atmix { position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%); display: flex; gap: 2px; padding: 1px 3px; background: #fff; border-radius: 6px; box-shadow: 0 0 0 1px rgba(0,0,0,.2); }
.pin .atmix i { width: 7px; height: 7px; border-radius: 50%; display: block; }
.atdot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; flex: none; box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--line); }
.pkg:has(.atdot) { grid-template-columns: 12px auto 1fr auto; }
.pkg .sp { background: var(--soft); border-radius: 10px; padding: 4px 8px; text-align: center; min-width: 54px; }
.pkg .sp small { display: block; font-size: .62rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; font-weight: 700; }
.pkg .sp b { font-size: 1.15rem; }
.pkg .tn b { font-size: 1.02rem; }
.pkg .meta { font-size: .8rem; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: .78rem; font-weight: 600; border-radius: 999px; padding: 3px 9px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.acc { background: var(--accent-soft); color: var(--accent); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--soft); border-radius: 12px; padding: 4px; }
.seg button { min-height: 38px; border: 0; background: transparent; color: var(--muted); font-size: .9rem; padding: 0 6px; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.reasons { display: flex; flex-wrap: wrap; gap: 6px; }
.reasons button { min-height: 36px; font-size: .86rem; padding: 0 12px; border-radius: 999px; font-weight: 500; }
.reasons button.on { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
textarea, input[type=text], input[type=search], input[type=number] { font: inherit; width: 100%; min-height: 48px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
textarea { min-height: 80px; resize: vertical; }
label.f { display: grid; gap: 6px; font-size: .88rem; color: var(--muted); }

/* lista */
.stop { display: grid; grid-template-columns: 46px 1fr auto; gap: 12px; align-items: center; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); text-align: left; font-weight: 400; width: 100%; min-height: 70px; }
.stop .addr { font-size: .98rem; }
.stop.isnext { border: 2px solid var(--accent); }
.stop .r { text-align: right; font-size: .82rem; color: var(--muted); }
.list { display: grid; gap: 8px; }
.empty { text-align: center; padding: 30px 10px; color: var(--muted); }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; margin: 6px 2px 0; }
.sec-h h3 { font-size: .82rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }

/* carregar */
.now { border: 2px solid var(--accent); }
.now .big { font-size: 2.6rem; font-weight: 800; line-height: 1; }
.zone { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; border-radius: 10px; padding: 6px 10px; }
.z1 { background: #eef2ff; color: #3730a3; } .z2 { background: #ecfeff; color: #0e7490; } .z3 { background: #f0fdf4; color: #15803d; }
@media (prefers-color-scheme: dark) { .z1 { background: #232a4d; color: #b4c0ff; } .z2 { background: #12343a; color: #8de1ee; } .z3 { background: #15301f; color: #8ee0a8; } }
.carsvg { width: 100%; max-width: 230px; height: auto; display: block; }
.carsvg.sm { max-width: 120px; }
.carsvg .body { fill: var(--soft); stroke: var(--line); stroke-width: 2; }
.carsvg .glass { fill: none; stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
.carsvg .cz rect { fill: var(--surface); stroke: var(--accent); stroke-width: 1.5; }
.carsvg .cz text { font: 600 11px -apple-system, system-ui, sans-serif; fill: var(--ink); text-anchor: middle; }
.carsvg .cz text.n { font-size: 15px; font-weight: 800; fill: var(--accent); }
.carsvg .cz.off rect { fill: transparent; stroke: var(--line); stroke-dasharray: 4 4; }
.carsvg .cz.off text { fill: var(--muted); font-weight: 500; }
.carsvg .cz.sel rect { fill: var(--accent); stroke: var(--accent); }
.carsvg .cz.sel text { fill: #fff; }
.carsvg [data-zpick], .carsvg [data-errsave] { cursor: pointer; }
.laygrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.layopt { flex-direction: column; align-items: center; gap: 6px; min-height: 0; padding: 12px 8px; text-align: center; font-weight: 400; }
.layopt b { font-size: .88rem; line-height: 1.25; }
.bigz { font-size: 1.9rem; font-weight: 800; line-height: 1.05; }
.bipgrid { display: grid; grid-template-columns: 110px 1fr; gap: 12px; align-items: center; }
.zgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ztile { min-height: 76px; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; padding: 10px 14px; text-align: left; }
.ztile b { font-size: 1rem; } .ztile span { font-size: .82rem; font-weight: 500; opacity: .8; }
.incar { display: inline-block; margin-top: 4px; background: var(--accent-soft); color: var(--accent); border-radius: 8px; padding: 3px 8px; font-size: .86rem; }
.zpick { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.zpick button { min-height: 40px; font-size: .86rem; padding: 0 8px; }
.zpick button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.lrow { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; border-radius: 0; font-weight: 400; min-height: 58px; width: 100%; }
.lrow .ck { width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; }
.lrow.done .ck { background: var(--ok); border-color: var(--ok); color: #fff; }
.lrow.done { color: var(--muted); }
.zphoto { display: grid; grid-template-columns: 64px 1fr auto; gap: 10px; align-items: center; }
.zphoto img, .zphoto .ph { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; background: var(--soft); display: grid; place-items: center; color: var(--muted); font-size: .7rem; text-align: center; }

/* bipar */
#bip { position: fixed; inset: 0; z-index: 2000; background: #000; color: #fff; }
#bip video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.bip-frame { position: absolute; left: 10%; right: 10%; top: 14%; height: 26%; border: 3px solid rgba(255,255,255,.9); border-radius: 20px; box-shadow: 0 0 0 9999px rgba(0,0,0,.35); }
#bip.f-ok .bip-frame { animation: fok .6s; } #bip.f-err .bip-frame { animation: ferr .8s; }
@keyframes fok { 0% { border-color: #16a34a; background: rgba(22,163,74,.3); } }
@keyframes ferr { 0% { border-color: #dc2626; background: rgba(220,38,38,.3); } }
.bip-top { position: absolute; left: 12px; right: 12px; top: calc(12px + env(safe-area-inset-top, 0px)); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.bip-top button { background: rgba(0,0,0,.55); color: #fff; border-color: rgba(255,255,255,.4); }
.bip-top span { font-weight: 700; text-shadow: 0 1px 3px #000; }
.bip-mode { position: absolute; left: 0; right: 0; top: calc(64px + env(safe-area-inset-top, 0px)); text-align: center; font-weight: 700; text-shadow: 0 1px 3px #000; }
.bip-bottom { position: absolute; left: 12px; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; }
.bip-card { background: var(--surface); color: var(--ink); border-radius: 18px; padding: 14px; display: grid; gap: 8px; border-left: 8px solid var(--ok); }
.bip-card.warn { border-left-color: var(--warn); } .bip-card.err { border-left-color: var(--bad); }
.bip-card .big { font-size: 2.3rem; font-weight: 800; line-height: 1; }
.ck-act { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
.ck-act button, .ck-row button { min-height: 32px; padding: 0 10px; font-size: .8rem; }
.ck-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.bzones { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.bzones button { min-height: 72px; flex-direction: column; gap: 2px; background: rgba(255,255,255,.92); color: #111827; border: 2px solid transparent; }
.bzones button b { font-size: 1.05rem; }
.bzones button span { font-size: .8rem; font-weight: 500; color: #6b7280; }
.bzones button.on { background: #2563eb; color: #fff; border-color: #fff; }
.bzones button.on span { color: #dbeafe; }

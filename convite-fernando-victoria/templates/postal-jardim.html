<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=420">
<title>Convite · Postal do jardim</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=EB+Garamond:ital,wght@0,400;1,400&family=Marcellus&family=Cinzel:wght@400&family=Pinyon+Script&family=Great+Vibes&family=Allura&display=swap">
<style>
:root{
  --card-bg:#FFFDF9;          /* branco jasmim */
  --card-text:#3E5778;        /* azul toile */
  --card-accent-1:#A8803F;    /* ouro envelhecido */
  --card-accent-2:#3E5778;    /* toile da faixa */
  --font-headline:'Pinyon Script', cursive;
  --font-body:'Cormorant Garamond', Garamond, serif;
  --font-caps:'Marcellus', 'Cormorant Garamond', serif;
}
*{box-sizing:border-box;margin:0;padding:0}
.card{width:420px;height:560px;position:relative;overflow:hidden;background-color:var(--card-bg);color:var(--card-text);font-family:var(--font-body)}

.photo-wrap{position:absolute;left:0;top:0;width:420px;height:382px;overflow:hidden}
.photo-wrap img{width:100%;height:100%;object-fit:cover;object-position:center 100%;display:block}
.photo-wrap::after{content:"";position:absolute;inset:10px;border:1px solid rgba(255,248,232,.75);pointer-events:none}

/* faixa de toile: andorinhas e raminhos repetidos */
.toile{position:absolute;left:0;top:382px;width:420px;height:24px;color:var(--card-accent-2);background-color:var(--card-bg);
  border-top:1px solid var(--card-accent-1);border-bottom:1px solid var(--card-accent-1)}
.toile svg{display:block;width:420px;height:22px;opacity:.85}

.text{position:absolute;left:0;right:0;top:406px;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2px 30px 8px}
.kicker{font-family:var(--font-caps);font-size:8px;letter-spacing:.32em;color:var(--card-accent-1)}
.names{font-family:var(--font-headline);font-weight:400;font-size:35px;line-height:1.08;color:var(--card-accent-1);white-space:nowrap;margin-top:2px}
.names .amp{font-size:.78em;padding:0 2px}
.invite{font-style:italic;font-size:13px;line-height:1.25;margin-top:1px}
.date{font-family:var(--font-caps);font-size:12.5px;letter-spacing:.26em;margin-top:6px}
.when{font-style:italic;font-size:12px;margin-top:1px;opacity:.85}
.city{font-family:var(--font-caps);font-size:8.5px;letter-spacing:.3em;margin-top:5px;color:var(--card-accent-1)}
.monogram{position:absolute;right:22px;top:22px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  background-color:var(--card-bg);box-shadow:0 0 0 1px var(--card-accent-1);font-family:var(--font-headline);font-size:17px;color:var(--card-accent-1);padding-top:2px}
.hidden{display:none !important}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="swallow" viewBox="0 0 60 30"><path fill="currentColor" d="M30 15c-3-1-6-4-9-9-1 4 0 7 3 9-6-1-12 0-18 3 6 0 11 0 15 1-4 2-8 6-11 10 5-3 10-5 15-6 2 0 4-1 5-2 1 1 3 2 5 2 5 1 10 3 15 6-3-4-7-8-11-10 4-1 9-1 15-1-6-3-12-4-18-3 3-2 4-5 3-9-3 5-6 8-9 9z"/></symbol>
  <pattern id="toile-pat" x="-8" width="70" height="24" patternUnits="userSpaceOnUse">
    <use href="#swallow" x="4" y="5" width="26" height="13"/>
    <g fill="currentColor"><path d="M38 17c6-1 14-5 26-11" fill="none" stroke="currentColor" stroke-width=".8"/><path d="M44 15c-1-4 1-6 4-7 0 3-1 5-4 7z"/><path d="M46 14c3-3 6-3 8-2-2 2-5 3-8 2z"/><path d="M53 11c0-4 2-6 5-6 0 3-2 5-5 6z"/><path d="M55 10c3-2 6-2 8-1-2 2-5 2-8 1z"/></g>
  </pattern>
</defs></svg>

<div class="card">
  <div class="photo-wrap">
    <img id="main-photo" src="{{design.primary_photo_url}}" alt="{{names.groom_pt}} e {{names.bride_pt}} no terraço ao entardecer">
  </div>
  <div class="monogram optional">{{names.groom_initial}}&amp;{{names.bride_initial}}</div>
  <div class="toile"><svg aria-hidden="true"><rect width="420" height="22" fill="url(#toile-pat)"/></svg></div>

  <div class="text">
    <p class="kicker">{{text.kicker_pt}}</p>
    <h1 class="names">{{names.groom_pt}} <span class="amp">&amp;</span> {{names.bride_pt}}</h1>
    <p class="invite">{{text.invite_pt}}</p>
    <p class="date">{{date.caps_pt}}</p>
    <p class="when">{{date.weekday_pt}} · {{time.pt}}</p>
    <p class="city">{{venue.city_pt}}</p>
  </div>
</div>
</body>
</html>
